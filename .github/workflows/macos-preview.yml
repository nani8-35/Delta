name: macOS preview
on:
  push:
    branches: [codex/macos-foundation]
    paths: ["macos/Delta/**", ".github/workflows/macos-preview.yml"]
  pull_request:
    paths: ["macos/Delta/**", ".github/workflows/macos-preview.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-and-test:
    runs-on: macos-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: macos/Delta
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: swift --version
      - name: Unit tests and app compilation
        run: swift test
      - name: Build development app bundle
        run: bash scripts/build-app.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Delta-macOS-development-preview
          path: macos/Delta/dist/*.zip
          if-no-files-found: error
